<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laços e Flores — Floricultura e Cestas</title>
<meta name="description" content="Cestas personalizadas, flores e balões em Triunfo – RS. Escolha um presente pronto ou monte a sua cesta.">
<meta name="theme-color" content="#7d7662">
<link rel="icon" href="img/emblema.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Laços e Flores — cores do logo: verde-oliva do laço, rosa da flor e fundo rosado */
:root{
  --oliva:#7d7662; --oliva-escuro:#5c5747; --oliva-claro:#a7a18a;
  --rosa:#e3a9b0; --rosa-escuro:#b9727d; --rosa-claro:#f8e3df;
  --blush:#fff4ee; --creme:#fffaf7; --papel:#fdf8f5;
  --texto:#3f3b31; --suave:#7a7366; --linha:#ecdfd8;
  --ok:#5f8a5a; --alerta:#c46a3d; --erro:#b4474f;
  --script:"Great Vibes","Brush Script MT",cursive;
  --titulo:"Cormorant Garamond",Georgia,serif;
  --corpo:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --raio:16px; --sombra:0 6px 24px rgba(92,87,71,.12);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--papel);color:var(--texto);font-family:var(--corpo);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* faixa e cabeçalho */
.faixa{background:var(--oliva-escuro);color:#f4efe4;font-size:13px}
.faixa .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:34px}
.faixa a{color:#fff;font-weight:700;text-decoration:none;opacity:.9;white-space:nowrap}
.faixa a:hover{opacity:1;text-decoration:underline}
.topo{position:sticky;top:0;z-index:30;background:rgba(255,250,247,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.marca img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--rosa-claro)}
.marca>span{min-width:0;overflow:hidden}
.marca b{font-family:var(--script);font-weight:400;font-size:28px;color:var(--oliva-escuro);line-height:1;white-space:nowrap}
.marca small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.topo nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.topo nav a.lnk{display:none;padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:700;color:var(--oliva-escuro)}
.topo nav a.lnk:hover{background:var(--rosa-claro)}
@media(min-width:760px){.topo nav a.lnk{display:inline-block}}
.btn-sacola{position:relative;display:flex;align-items:center;gap:8px;background:var(--oliva);color:#fff;padding:10px 14px;border-radius:99px;font-weight:800}
.btn-sacola:hover{background:var(--oliva-escuro)}
@media(max-width:430px){.btn-sacola .txt{display:none}.marca small{font-size:10px}}
.btn-sacola .qt{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--rosa);color:var(--oliva-escuro);font-size:13px;display:grid;place-items:center}

/* hero */
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--rosa-claro) 0%,var(--blush) 45%,var(--creme) 100%);border-bottom:1px solid var(--linha);overflow:hidden}
.hero .wrap{display:grid;gap:24px;padding-top:36px;padding-bottom:40px;align-items:center}
@media(min-width:820px){.hero .wrap{grid-template-columns:1.2fr .8fr;padding-top:56px;padding-bottom:60px}}
.hero h1{font-family:var(--script);font-weight:400;font-size:clamp(52px,12vw,88px);line-height:.95;color:var(--oliva-escuro)}
.hero .sub{font-family:var(--titulo);font-size:clamp(20px,4.6vw,26px);font-weight:600;color:var(--rosa-escuro);margin-top:6px}
.hero p.txt{margin-top:14px;max-width:520px;color:var(--suave);font-size:17px}
.hero .acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .selo{justify-self:center;position:relative;width:min(300px,46vw);aspect-ratio:1;order:-1}
@media(min-width:820px){.hero .selo{order:0}}
.hero .selo img{width:100%;height:100%;border-radius:50%;box-shadow:0 18px 50px rgba(185,114,125,.25),0 0 0 10px rgba(255,255,255,.7)}
.hero .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hero .tags span{background:#fff;border:1px solid var(--linha);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--oliva-escuro)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:99px;font-weight:800;text-decoration:none;transition:transform .15s,background .15s}
.bt:active{transform:scale(.97)}
.bt-1{background:var(--oliva);color:#fff}.bt-1:hover{background:var(--oliva-escuro)}
.bt-2{background:#fff;color:var(--oliva-escuro);border:2px solid var(--oliva)}.bt-2:hover{background:var(--blush)}
.bt-rosa{background:var(--rosa-escuro);color:#fff}.bt-rosa:hover{background:#a3606b}
.bt-zap{background:#25a35a;color:#fff}.bt-zap:hover{background:#1d8a4b}
.bt[disabled]{opacity:.45;pointer-events:none}

/* seções */
section.bloco{padding:44px 0}
.cab{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:18px}
.cab h2{font-family:var(--titulo);font-size:clamp(30px,7vw,40px);font-weight:700;color:var(--oliva-escuro);line-height:1.05}
.cab h2 em{font-family:var(--script);font-style:normal;font-weight:400;color:var(--rosa-escuro);font-size:1.15em}
.cab p{color:var(--suave);max-width:560px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;background:#fff;border:1px solid var(--linha);font-weight:700;color:var(--oliva-escuro);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--oliva);border-color:var(--oliva);color:#fff}

/* produtos */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.grade{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(min-width:1000px){.grade{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:#fff;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column;border:1px solid #f3e9e4}
.card .foto{position:relative;aspect-ratio:3/4;background:var(--blush)}
.card .foto img{width:100%;height:100%;object-fit:cover}
.card .foto .emo{width:100%;height:100%;display:grid;place-items:center;font-size:56px}
.selo-dest{position:absolute;top:8px;left:8px;background:var(--rosa-escuro);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:99px}
.card .corpo{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:15.5px;font-weight:800;line-height:1.2}
.card .desc{font-size:13.5px;color:var(--suave);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .rodape{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:6px}
.preco{font-weight:800;color:var(--oliva-escuro);font-size:17px;white-space:nowrap}
.preco small{font-weight:600;font-size:11px;color:var(--suave);display:block;line-height:1}
.add{width:40px;height:40px;border-radius:50%;background:var(--oliva);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;flex:none}
.add:hover{background:var(--oliva-escuro)}
.vazio{padding:28px;text-align:center;color:var(--suave);background:#fff;border-radius:var(--raio);border:1px dashed var(--linha)}

/* monte sua cesta */
.monte{background:linear-gradient(180deg,var(--blush),var(--creme));border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.monte-grid{display:grid;gap:18px}
@media(min-width:960px){.monte-grid{grid-template-columns:1fr 340px;align-items:start}}
.etapa{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);border:1px solid #f3e9e4;overflow:hidden}
.etapa+.etapa{margin-top:14px}
.etapa>header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--linha);background:var(--creme)}
.etapa>header .num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--oliva);color:#fff;display:grid;place-items:center;font-weight:800}
.etapa>header .num.ok{background:var(--rosa-escuro)}
.etapa>header h3{font-family:var(--titulo);font-size:22px;font-weight:700;color:var(--oliva-escuro);line-height:1.1}
.etapa>header p{font-size:13px;color:var(--suave)}
.etapa>header .soma{margin-left:auto;font-weight:800;color:var(--oliva-escuro);white-space:nowrap;font-size:14px}
.opcoes{display:grid;gap:0}
@media(min-width:640px){.opcoes{grid-template-columns:1fr 1fr}}
.op{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f4ece8}
@media(min-width:640px){.op:nth-child(odd){border-right:1px solid #f4ece8}}
.op .ic{width:46px;height:46px;flex:none;border-radius:12px;background:var(--blush);display:grid;place-items:center;font-size:24px;overflow:hidden}
.op .ic img{width:100%;height:100%;object-fit:cover}
.op .info{min-width:0;flex:1}
.op .info b{display:block;font-size:14.5px;line-height:1.2}
.op .info span{display:block;font-size:12.5px;color:var(--suave);line-height:1.25}
.op .info .pr{color:var(--oliva-escuro);font-weight:800;font-size:13.5px;margin-top:2px}
.op.sel{background:#fbf3f0}
.qtd{display:flex;align-items:center;gap:2px;flex:none;background:var(--blush);border-radius:99px;padding:3px}
.qtd button{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--oliva-escuro);font-weight:800;font-size:18px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qtd button:disabled{opacity:.35}
.qtd output{min-width:24px;text-align:center;font-weight:800}
.radio{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--oliva-claro);display:grid;place-items:center}
.op.sel .radio{border-color:var(--rosa-escuro)}
.op.sel .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--rosa-escuro)}
.op.base{cursor:pointer}
.op.bloq{opacity:.5;cursor:not-allowed;background:#faf7f5}
.op .cad{flex:none;font-size:18px;width:28px;text-align:center}
.op .info .esp{display:inline-block;margin-top:2px;font-size:11.5px;color:var(--oliva);font-weight:700}
.ideal{font-style:normal;font-size:11px;font-weight:800;background:var(--rosa-claro);color:var(--rosa-escuro);padding:2px 8px;border-radius:99px;margin-left:4px;vertical-align:1px}
.trava{padding:18px 16px;font-size:14.5px;color:var(--suave);background:#fbf6f3;line-height:1.5}
.trava a{color:var(--rosa-escuro);font-weight:800}
.ocupa{padding:12px 16px 4px;font-size:14px;color:var(--suave)}
.ocupa b{color:var(--oliva-escuro)}
.medidor{height:9px;background:var(--blush);border-radius:99px;overflow:hidden;margin-top:8px}
.medidor span{display:block;height:100%;background:linear-gradient(90deg,var(--oliva-claro),var(--oliva));border-radius:99px}
.cesta-esc{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px;margin-top:4px;padding-top:10px;border-top:1px dashed var(--linha)}
.resumo{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);border:1px solid #f3e9e4;padding:18px}
@media(min-width:960px){.resumo{position:sticky;top:84px}}
.resumo h3{font-family:var(--titulo);font-size:26px;color:var(--oliva-escuro)}
.resumo ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px;font-size:14px}
.resumo li{display:flex;justify-content:space-between;gap:10px}
.resumo li span:last-child{white-space:nowrap;font-weight:700}
.resumo .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--linha);padding-top:12px;margin-top:6px}
.resumo .tot b{font-size:26px;color:var(--oliva-escuro)}
.resumo .aviso{font-size:13px;color:var(--alerta);margin:8px 0}
.resumo textarea{width:100%;margin-top:8px}
.barra-monte{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--oliva-escuro);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(0,0,0,.15);transform:translateY(110%);transition:transform .25s}
.barra-monte.on{transform:none}
.barra-monte .v{font-size:12px;opacity:.85;line-height:1.1}
.barra-monte b{font-size:20px}
.barra-monte .bt{margin-left:auto;padding:10px 16px}
@media(min-width:960px){.barra-monte{display:none}}

/* como funciona / rodapé */
.passos{display:grid;gap:12px}
@media(min-width:760px){.passos{grid-template-columns:repeat(4,1fr)}}
.passo{background:#fff;border-radius:var(--raio);padding:18px;border:1px solid var(--linha)}
.passo b{display:block;font-family:var(--titulo);font-size:21px;color:var(--oliva-escuro);margin:6px 0 4px}
.passo p{font-size:14px;color:var(--suave)}
.passo .n{font-family:var(--script);font-size:38px;color:var(--rosa-escuro);line-height:1}
footer.rod{background:var(--oliva-escuro);color:#efe9dc;padding:36px 0 calc(90px + env(safe-area-inset-bottom))}
footer.rod .wrap{display:grid;gap:22px}
@media(min-width:760px){footer.rod .wrap{grid-template-columns:1.3fr 1fr 1fr}}
footer.rod h4{font-family:var(--script);font-weight:400;font-size:36px;color:#fff}
footer.rod p,footer.rod li{font-size:14px;opacity:.9}
footer.rod ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
footer.rod a{color:#fff}
footer.rod .cred{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;font-size:12.5px;opacity:.75}

/* sacola (gaveta) */
.fundo{position:fixed;inset:0;background:rgba(40,36,28,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--papel);z-index:51;transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column}
.gaveta.on{transform:none}
.gaveta>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linha);background:#fff}
.gaveta>header h2{font-family:var(--titulo);font-size:26px;color:var(--oliva-escuro)}
.fechar{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--blush);font-size:22px;color:var(--oliva-escuro)}
.gaveta .rolar{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.item{display:flex;gap:12px;background:#fff;border-radius:14px;padding:10px;border:1px solid var(--linha)}
.item+.item{margin-top:10px}
.item .ft{width:62px;height:62px;flex:none;border-radius:10px;overflow:hidden;background:var(--blush);display:grid;place-items:center;font-size:28px}
.item .ft img{width:100%;height:100%;object-fit:cover}
.item .meio{flex:1;min-width:0}
.item .meio b{display:block;font-size:14.5px;line-height:1.2}
.item .meio .comp{font-size:12px;color:var(--suave);margin-top:2px}
.item .linha{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.rem{font-size:12.5px;color:var(--erro);text-decoration:underline;padding:4px 0}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-family:var(--titulo);font-weight:700;font-size:21px;color:var(--oliva-escuro);margin-bottom:8px;padding:0}
.campo{display:grid;gap:4px;margin-top:10px}
.campo label{font-size:13.5px;font-weight:700;color:var(--oliva-escuro)}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--linha);background:#fff;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--oliva-claro);box-shadow:0 0 0 3px rgba(167,161,138,.25)}
textarea{min-height:76px;resize:vertical}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modo{border:2px solid var(--linha);border-radius:14px;padding:12px;background:#fff;text-align:left}
.modo b{display:block}
.modo span{font-size:12.5px;color:var(--suave)}
.modo[aria-pressed="true"]{border-color:var(--oliva);background:#f6f4ee}
.contas{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px;margin-top:18px;font-size:14.5px}
.contas div{display:flex;justify-content:space-between;padding:3px 0}
.contas .t{border-top:1px dashed var(--linha);margin-top:6px;padding-top:8px;font-size:18px;font-weight:800;color:var(--oliva-escuro)}
.gaveta footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--linha);background:#fff}
.gaveta footer .bt{width:100%}
.erro-msg{color:var(--erro);font-size:13.5px;margin-top:8px}
.nota{font-size:12.5px;color:var(--suave);margin-top:6px}

/* toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--oliva-escuro);color:#fff;padding:12px 18px;border-radius:99px;font-weight:700;font-size:14.5px;z-index:80;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- painel ---------- */
.adm{min-height:100vh;background:#f6f3ee}
.adm-topo{background:var(--oliva-escuro);color:#fff}
.adm-topo .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.adm-topo img{width:36px;height:36px;border-radius:50%}
.adm-topo b{font-family:var(--script);font-weight:400;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.adm-topo a,.adm-topo button{margin-left:auto;color:#fff;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.adm-topo button+a,.adm-topo a+button{margin-left:12px}
.abas{background:#fff;border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:10}
.abas .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.abas .wrap::-webkit-scrollbar{display:none}
.abas button{padding:14px 14px;font-weight:800;color:var(--suave);border-bottom:3px solid transparent;white-space:nowrap}
.abas button[aria-selected="true"]{color:var(--oliva-escuro);border-color:var(--rosa-escuro)}
.adm main{padding:20px 0 60px}
.adm h2{font-family:var(--titulo);font-size:30px;color:var(--oliva-escuro);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:800px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--linha)}
.kpi span{font-size:12.5px;color:var(--suave);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:22px;color:var(--oliva-escuro);margin-top:4px}
.painel{background:#fff;border-radius:14px;border:1px solid var(--linha);padding:14px;margin-top:14px}
.painel h3{font-size:16px;font-weight:800;margin-bottom:8px;color:var(--oliva-escuro)}
.lista{display:grid;gap:10px}
.ped{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px}

.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th,.tabela td{text-align:left;padding:9px 8px;border-bottom:1px solid #f0e8e3;vertical-align:middle}
.tabela th{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
.tabela td.n{text-align:right;white-space:nowrap}
.tabela img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.rolagem{overflow-x:auto}
.form-adm{display:grid;gap:10px}

.linha-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.login form{display:grid;gap:10px;margin-top:14px;text-align:left}
.modal{position:fixed;inset:0;z-index:90;background:rgba(40,36,28,.5);display:grid;place-items:end center;padding:0}

const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

function calcMonte() {
  let t = 0, n = 0, espaco = 0;

  }
  const etBase = DB.monte.find(e => e.unica);
  const bases = (etBase ? etBase.itens : []).filter(b => b.ativo).sort((a, b) => num(a.capacidade) - num(b.capacidade) || a.preco - b.preco);
  const cabem = bases.filter(b => num(b.capacidade) >= espaco);
  let base = null;
  if (estado.monte.base) { const b = itemMonte(estado.monte.base); if (b && b.ativo) base = b; }
  if (base) t += base.preco;
  return { t, n, espaco, base, bases, cabem, maior: bases.reduce((m, b) => Math.max(m, num(b.capacidade)), 0) };
}

/* se o cliente mudou os itens e a cesta escolhida não comporta mais, libera a escolha de novo */
function conferirBase() {
  const { espaco, n, base } = calcMonte();
  if (base && (n === 0 || num(base.capacidade) < espaco)) {
    estado.monte.base = null;
    toast(n ? "A cesta escolhida não comporta mais os itens — escolha outra 🧺" : "Escolha os itens antes da cesta");
  }
}

function renderEtapas() {
  const calc = calcMonte();
  let n = 0;
  $("#etapas").innerHTML = DB.monte.map(et => {
    const itens = et.itens.filter(i => i.ativo);
    if (!itens.length) return "";
    n++;
    if (et.unica) return etapaCestas(et, n, calc);
    let soma = 0;
    itens.forEach(i => soma += i.preco * (estado.monte.qtd[i.id] || 0));
    const feito = soma > 0;
    return `<div class="etapa" data-etapa="${esc(et.id)}">
      <header><span class="num ${feito ? "ok" : ""}">${feito ? "✓" : n}</span><div><h3>${esc(et.emoji)} ${esc(et.titulo)}</h3><p>${esc(et.dica)}</p></div>${feito ? `<span class="soma">${brl(soma)}</span>` : ""}</header>
      <div class="opcoes">${itens.map(i => {
        const q = estado.monte.qtd[i.id] || 0, e = num(i.espaco);
        return `<div class="op ${q ? "sel" : ""}">
          <span class="ic">${i.img ? `<img src="${res(i.img)}" alt="">` : esc(i.emoji)}</span>
          <span class="info"><b>${esc(i.nome)}</b><span>${esc(i.desc)}</span><span class="pr">${brl(i.preco)}</span><span class="esp">${e ? "📦 ocupa " + plural(e, "espaço", "espaços") : "vai por fora da cesta"}</span></span>
          <span class="qtd"><button data-menos="${esc(i.id)}" ${q ? "" : "disabled"} aria-label="Tirar ${esc(i.nome)}">−</button><output>${q}</output><button data-mais="${esc(i.id)}" aria-label="Adicionar ${esc(i.nome)}">+</button></span></div>`;
      }).join("")}</div></div>`;
  }).join("");
  const el = $("#etapas");
  el.onclick = e => {
    const b = e.target.closest("[data-base]"), m = e.target.closest("[data-mais]"), l = e.target.closest("[data-menos]");
    if (b) estado.monte.base = estado.monte.base === b.dataset.base ? null : b.dataset.base;
    else if (m) { estado.monte.qtd[m.dataset.mais] = (estado.monte.qtd[m.dataset.mais] || 0) + 1; conferirBase(); }
    else if (l) { estado.monte.qtd[l.dataset.menos] = Math.max(0, (estado.monte.qtd[l.dataset.menos] || 0) - 1); conferirBase(); }
    else return;
    const y = window.scrollY; renderEtapas(); renderResumoMonte(); window.scrollTo(0, y);
  };
  el.onkeydown = e => { const b = e.target.closest("[data-base]"); if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); b.click(); } };
}

/* última etapa: as cestas só aparecem depois dos itens, e só as que comportam tudo ficam liberadas */
function etapaCestas(et, n, calc) {
  const { n: qtd, espaco, cabem, bases, maior, base } = calc;
  let corpo;
  if (!qtd) {
    corpo = `<div class="trava">🔒 <b>Escolha os itens primeiro.</b><br>Assim que você adicionar flores, chocolates, bebidas, balões ou extras, mostramos aqui as cestas que comportam tudo.</div>`;
  } else if (!cabem.length) {
    corpo = `<div class="trava">😮 <b>Seus itens ocupam ${plural(espaco, "espaço", "espaços")}</b> — mais do que a nossa maior cesta (${maior}).<br>Tire alguns itens ou <a href="https://wa.me/${zap(DB.config.whatsapp)}" target="_blank" rel="noopener">fale com a gente no WhatsApp</a> para montar em duas cestas.</div>`;
  } else {
    corpo = `<p class="ocupa">Seus itens ocupam <b>${plural(espaco, "espaço", "espaços")}</b>. ${cabem.length === bases.length ? "Todas as cestas comportam:" : "Liberamos só as cestas que comportam tudo:"}</p>
      <div class="opcoes">${bases.map(b => {
        const cabe = num(b.capacidade) >= espaco, sel = estado.monte.base === b.id, ideal = cabe && b.id === cabem[0].id;
        return `<div class="op base ${sel ? "sel" : ""} ${cabe ? "" : "bloq"}" ${cabe ? `role="radio" tabindex="0" aria-checked="${sel}" data-base="${esc(b.id)}"` : `aria-disabled="true"`}>
          <span class="ic">${b.img ? `<img src="${res(b.img)}" alt="">` : esc(b.emoji)}</span>
          <span class="info"><b>${esc(b.nome)}${ideal ? '<em class="ideal">Ideal</em>' : ""}</b><span>${esc(b.desc)} · até ${plural(num(b.capacidade), "espaço", "espaços")}</span><span class="pr">${cabe ? brl(b.preco) : "Não comporta os seus itens"}</span></span>
          ${cabe ? '<span class="radio" aria-hidden="true"></span>' : '<span class="cad" aria-hidden="true">🔒</span>'}</div>`;
      }).join("")}</div>`;
  }
  const feito = !!base;
  return `<div class="etapa" data-etapa="${esc(et.id)}">
    <header><span class="num ${feito ? "ok" : ""}">${feito ? "✓" : qtd ? n : "🔒"}</span><div><h3>${esc(et.emoji)} ${esc(et.titulo)}</h3><p>${esc(et.dica)}</p></div>${feito ? `<span class="soma">${brl(base.preco)}</span>` : ""}</header>
    ${corpo}</div>`;
}

function renderResumoMonte() {
  const c = calcMonte();
  const linhas = [];
  for (const et of DB.monte) {
    if (et.unica) continue;
    for (const i of et.itens) { const q = estado.monte.qtd[i.id] || 0; if (i.ativo && q > 0) linhas.push([i.nome, i.preco * q, q]); }
  }
  const cap = c.base ? num(c.base.capacidade) : 0;
  const pct = cap ? Math.min(100, Math.round(c.espaco / cap * 100)) : 0;
  $("#resumoMonte").innerHTML = `<h3>Sua cesta</h3>
    ${linhas.length ? `<ul>${linhas.map(([nm, v, q]) => `<li><span>${q > 1 ? q + "× " : ""}${esc(nm)}</span><span>${brl(v)}</span></li>`).join("")}</ul>`
      : `<p class="nota" style="margin:12px 0">Comece escolhendo os itens. Cada um aparece aqui com o valor, e depois liberamos as cestas que comportam tudo.</p>`}
    ${c.base ? `<div class="cesta-esc"><span>🧺 ${esc(c.base.nome)}</span><span>${brl(c.base.preco)}</span></div>
      <div class="medidor" role="img" aria-label="Ocupação da cesta"><span style="width:${pct}%"></span></div>
      <p class="nota">Ocupando ${c.espaco} de ${plural(cap, "espaço", "espaços")}</p>`
      : c.n ? `<p class="aviso">${c.cabem.length ? "Agora escolha a cesta — liberamos só as que comportam seus itens." : "Seus itens não cabem em uma cesta só."}</p>` : ""}
    <div class="tot"><span>${plural(c.n, "item", "itens")}${c.base ? " + cesta" : ""}</span><b>${brl(c.t)}</b></div>
    <label class="campo"><span class="mini">Alguma observação? (cores, preferências…)</span><textarea id="obsMonte" maxlength="300" placeholder="Ex.: laço rosa, sem chocolate amargo">${esc(estado.monte.obs || "")}</textarea></label>
    <div class="linha-acoes"><button class="bt bt-1" id="addMonte" style="flex:1" ${c.base && c.n ? "" : "disabled"}>Confirmar cesta</button>
    ${linhas.length || c.base ? `<button class="bt bt-2 bt-p" id="limparMonte">Limpar</button>` : ""}</div>`;
  $("#obsMonte").oninput = e => estado.monte.obs = e.target.value;
  $("#addMonte").onclick = addMonte;
  const lp = $("#limparMonte"); if (lp) lp.onclick = () => { estado.monte = { base: null, qtd: {} }; renderEtapas(); renderResumoMonte(); };
  const bt = $("#barraTotal"); if (bt) bt.textContent = brl(c.t);
  const barra = $("#barraMonte"); if (barra) barra.dataset.tem = c.n ? "1" : "";
  atualizarBarra();
}

let monteVisivel = false;
function observarMonte() {
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(es => { monteVisivel = es[0].isIntersecting; atualizarBarra(); }, { threshold: 0.05 });
  io.observe($("#etapas"));
}
function atualizarBarra() { const b = $("#barraMonte"); if (b) b.classList.toggle("on", monteVisivel && b.dataset.tem === "1"); }

function addProduto(id) {
  const p = DB.produtos.find(x => x.id === id); if (!p) return;
  const ex = sacola.find(x => x.tipo === "produto" && x.pid === id);
  if (ex) ex.qtd++; else sacola.push({ key: uid("s"), tipo: "produto", pid: id, nome: p.nome, preco: p.preco, img: p.img, qtd: 1 });
  salvarSacola(); atualizarContador(); toast(`${p.nome} foi para a sacola 🌸`);
}

function addMonte() {
  const c = calcMonte();
  if (!c.n) { toast("Escolha os itens da cesta primeiro"); return; }
  if (!c.base) { toast("Agora escolha a cesta 🧺"); return; }
  const comp = [{ nome: c.base.nome, qtd: 1, preco: c.base.preco, etapa: "Cesta", emoji: "🧺", base: true, capacidade: num(c.base.capacidade) }];
  for (const et of DB.monte) {
    if (et.unica) continue;
    for (const i of et.itens) { const q = estado.monte.qtd[i.id] || 0; if (i.ativo && q > 0) comp.push({ nome: i.nome, desc: i.desc, qtd: q, preco: i.preco, etapa: et.titulo, emoji: et.emoji, espaco: num(i.espaco) }); }
  }
  const total = comp.reduce((s, x) => s + x.preco * x.qtd, 0);
  const numero = sacola.filter(x => x.tipo === "monte").length + 1;
  sacola.push({ key: uid("s"), tipo: "monte", nome: `Cesta montada por você${numero > 1 ? " #" + numero : ""}`, preco: total, qtd: 1, comp, obs: (estado.monte.obs || "").trim(), emoji: "🧺", espaco: c.espaco, capacidade: num(c.base.capacidade) });
  salvarSacola(); estado.monte = { base: null, qtd: {} };
  renderEtapas(); renderResumoMonte(); atualizarContador(); toast("Cesta confirmada! Agora é só informar a entrega 🧺"); abrirSacola();
}

function atualizarContador() { const q = sacola.reduce((s, i) => s + i.qtd, 0); const el = $("#qtSacola"); if (el) el.textContent = q; }

function finalizar() {
  const c = DB.config, { sub, frete, reg, total } = contas();
  const faltas = [];
  if (estado.entrega === "entrega") { if (!reg) faltas.push("a região de entrega"); if (!form.endereco.trim()) faltas.push("o endereço"); }
  if (!form.data) faltas.push("a data");
  if (!form.nome.trim()) faltas.push("o seu nome");
  if (soDigitos(form.tel).length < 10) faltas.push("o seu WhatsApp com DDD");
  if (faltas.length) { erroSacola = "Falta preencher: " + faltas.join(", ") + "."; $("#erroSacola").textContent = erroSacola; return; }
  erroSacola = "";
  DB.seq = (DB.seq || 100) + 1;
  const ped = {
    id: uid("o"), codigo: "LF" + DB.seq, criado: new Date().toISOString(), status: "novo", pago: false,
    cliente: form.nome.trim(), tel: soDigitos(form.tel), entrega: estado.entrega,
    regiao: reg ? reg.nome : "", endereco: form.endereco.trim(), bairro: form.bairro.trim(), ref: form.ref.trim(),
    data: form.data, periodo: form.periodo, pagamento: form.pag, destinatario: form.destinatario.trim(), cartao: form.cartao.trim(), obs: form.obs.trim(),
    itens: sacola.map(i => ({ nome: i.nome, qtd: i.qtd, preco: i.preco, tipo: i.tipo, comp: i.comp || null, obsItem: i.obs || "", espaco: i.espaco || 0, capacidade: i.capacidade || 0 })),
    subtotal: sub, frete, desconto: 0, total
  };
  DB.pedidos.unshift(ped); salvar();
  const url = `https://wa.me/${zap(c.whatsapp)}?text=${encodeURIComponent(mensagemPedido(ped))}`;
  sacola = []; salvarSacola(); atualizarContador();
  renderSacola();

  window.open(url, "_blank");
}

/* detalhe da cesta montada, agrupado por etapa, para a mensagem do WhatsApp */
function detalheCesta(i) {
  const out = [], base = i.comp.find(x => x.base), grupos = {};
  if (base) out.push(`   🧺 *Cesta:* ${base.nome}${base.capacidade ? ` (até ${base.capacidade} espaços)` : ""} — ${brl(base.preco)}`);
  for (const x of i.comp) if (!x.base) (grupos[x.etapa] = grupos[x.etapa] || { emoji: x.emoji || "•", itens: [] }).itens.push(x);
  for (const [et, g] of Object.entries(grupos)) {
    out.push(`   ${g.emoji} *${et}:*`);
    for (const x of g.itens) out.push(`      ◦ ${x.qtd}x ${x.nome}${x.desc ? " (" + x.desc + ")" : ""} — ${x.qtd > 1 ? brl(x.preco) + " cada = " : ""}${brl(x.preco * x.qtd)}`);
  }
  if (i.capacidade) out.push(`   📦 Ocupação: ${i.espaco} de ${i.capacidade} espaços`);
  return out;
}

function mensagemPedido(p) {
  const c = DB.config, L = [];
  L.push(`🌸 *Pedido — ${c.nome}*`); L.push(`Pedido: *${p.codigo}*`); L.push("");
  L.push(`*Cliente:* ${p.cliente}`); L.push(`*WhatsApp:* ${fone(p.tel)}`); L.push("");
  L.push("🧺 *Itens*");
  for (const i of p.itens) {
    L.push(`• ${i.qtd}x ${i.nome} — ${brl(i.preco * i.qtd)}`);
    if (i.comp) L.push(...detalheCesta(i));
    if (i.obsItem) L.push(`   _Obs.: ${i.obsItem}_`);
  }
  L.push("");
  if (p.entrega === "entrega") {
    L.push(`🚚 *Entrega — ${p.regiao}*`);
    L.push(`Endereço: ${[p.endereco, p.bairro].filter(Boolean).join(" — ")}`);
    if (p.ref) L.push(`Referência: ${p.ref}`);
  } else { L.push("🏪 *Retirada na loja*"); }
  L.push(`Data: ${dataBR(p.data)} · ${PERIODOS[p.periodo] || p.periodo}`);
  L.push("");
  if (p.destinatario) L.push(`🎁 *Para:* ${p.destinatario}`);
  if (p.cartao) L.push(`💌 *Cartão:* "${p.cartao}"`);
  if (p.destinatario || p.cartao) L.push("");
  L.push(`Produtos: ${brl(p.subtotal)}`);
  if (p.entrega === "entrega") L.push(`Frete: ${brl(p.frete)}`);
  if (p.desconto) L.push(`Desconto: -${brl(p.desconto)}`);
  L.push(`*Total: ${brl(p.total)}*`);
  L.push(`Pagamento: ${PAGAMENTOS[p.pagamento] || p.pagamento} (combinar aqui pelo WhatsApp)`);
  if (p.obs) { L.push(""); L.push(`Obs.: ${p.obs}`); }
  return L.join("\n");
}

function acoesPedido(e) {
  const el = e.target.closest("[data-acao]"); if (!el) return;
  const acao = el.dataset.acao; if (acao === "status" && e.type !== "change") return;
  if (acao !== "status" && e.type === "change") return;
  const p = DB.pedidos.find(x => x.id === el.closest(".ped").dataset.id); if (!p) return;
  if (acao === "status") { p.status = el.value; toast(`${p.codigo}: ${STATUS[p.status]}`); }
  if (acao === "pagar") { p.pago = true; DB.financeiro.unshift({ id: uid("f"), data: hojeISO(), tipo: "entrada", desc: `Pedido ${p.codigo} — ${p.cliente}`, valor: p.total, pedido: p.id }); toast("Pagamento lançado em Entradas"); }
  if (acao === "desconto") {
    const v = prompt(`Desconto em R$ para ${p.codigo} (atual: ${reais(p.desconto || 0)})`, reais(p.desconto || 0)); if (v === null) return;
    p.desconto = Math.min(centavos(v), p.subtotal + p.frete); p.total = p.subtotal + p.frete - p.desconto;
  }
  if (acao === "excluir") { if (!confirm(`Excluir o pedido ${p.codigo}? Isso não pode ser desfeito.`)) return; DB.pedidos = DB.pedidos.filter(x => x !== p); }
  salvar(); renderAdmin();
}

function calendario() {
  const [a, m] = (mesFin || hojeISO().slice(0, 7)).split("-").map(Number);
  const primeiro = new Date(a, m - 1, 1), dias = new Date(a, m, 0).getDate();
  const ped = DB.pedidos.filter(p => p.status !== "cancelado" && (p.data || "").startsWith(`${a}-${String(m).padStart(2, "0")}`));
  let h = `<div class="painel"><div class="linha-acoes" style="margin:0 0 10px;align-items:center"><button class="bt bt-2 bt-p" data-mes="-1">‹</button><b style="flex:1;text-align:center">${primeiro.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}</b><button class="bt bt-2 bt-p" data-mes="1">›</button></div><div class="cal">`;
  h += ["D", "S", "T", "Q", "Q", "S", "S"].map(d => `<div class="hd">${d}</div>`).join("");
  for (let i = 0; i < primeiro.getDay(); i++) h += "<div style='background:none'></div>";
  for (let d = 1; d <= dias; d++) {
    const iso = `${a}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`, ps = ped.filter(p => p.data === iso);
    h += `<div class="${ps.length ? "tem" : ""}"><b>${d}</b>${ps.map(p => `${p.codigo}`).join("<br>")}</div>`;
  }
  $("#listaPed").innerHTML = h + "</div></div>";
  $("#listaPed").onclick = e => { const b = e.target.closest("[data-mes]"); if (!b) return; const dt = new Date(a, m - 1 + Number(b.dataset.mes), 1); mesFin = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`; calendario(); };
}

function abrirModal(html, aoMontar) {

  const fechar = () => { d.remove(); document.body.style.overflow = ""; };
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-fechar]")) fechar(); });
  aoMontar(d, fechar);
}

function lerFoto(arquivo) {
  return new Promise((ok, erro) => {
    const r = new FileReader(); r.onerror = erro;
    r.onload = () => { const im = new Image(); im.onerror = erro; im.onload = () => {
      const max = 700, k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      ok(cv.toDataURL("image/jpeg", 0.78)); }; im.src = r.result; };
    r.readAsDataURL(arquivo);
  });
}

    salvar(); toast("Configurações salvas"); };
  $("#fs").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); if (f.get("s1") !== f.get("s2")) return toast("As senhas não conferem"); c.senha = f.get("s1"); salvar(); e.target.reset(); toast("Senha trocada"); };
  $("#exp").onclick = () => { const b = new Blob([JSON.stringify(DB, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `lacos-e-flores-${hojeISO()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $("#imp").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.produtos || !d.config) throw 0; d.versao = VERSAO_DADOS; DB = d; salvar(); toast("Cópia restaurada"); renderAdmin(); } catch (er) { toast("Arquivo inválido"); } }; r.readAsText(f); };
  $("#reset").onclick = () => { if (!confirm("Apagar pedidos, lançamentos e alterações e voltar aos dados iniciais?")) return; DB = JSON.parse(JSON.stringify(DADOS_INICIAIS)); salvar(); toast("Dados iniciais restaurados"); renderAdmin(); };
}

/* ---------- rotas ---------- */
let telaAtual = "";
function rota() {
  const adm = location.hash === "#admin";
  if (adm) { telaAtual = "admin"; renderAdmin(); window.scrollTo(0, 0); return; }
  if (telaAtual !== "catalogo") { telaAtual = "catalogo"; renderCatalogo(); const alvo = location.hash && document.getElementById(location.hash.slice(1)); if (alvo) setTimeout(() => alvo.scrollIntoView(), 30); }
}
window.addEventListener("hashchange", rota);
window.addEventListener("storage", e => { if (e.key === CHAVE_DB) { DB = lerJSON(CHAVE_DB, DB); } });
rota();
</script>
